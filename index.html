function go(page,extra){ S.page=page; if(extra){for(var k in extra)S[k]=extra[k];} render(); }

}

// ==================== CALCULATOR LOGIC ====================
function calcBlockI(){
  initCalcDefaults();
  var subjects=S.calcSubjects;
  var lkDoubled=0;
  var wSum=0, wCount=0;
  subjects.forEach(function(sub){
    var isDoubled=sub.lk&&lkDoubled<2;
    if(sub.lk) lkDoubled++;
    var w=isDoubled?2:1;
    sub.grades.forEach(function(g){
      if(g!==''&&g!==null&&!isNaN(+g)){
        wSum+=Math.min(15,Math.max(0,+g))*w;
        wCount+=w;
      }
    });
  });
  if(wCount===0) return 0;
  return Math.min(600,Math.round((wSum/wCount)*40));
}
function calcSeminarScore(sem){
  var s=sem.schriftl, p=sem.praes;
  if(s===''||p===''||isNaN(+s)||isNaN(+p)) return null;
  return Math.round((Math.min(15,+s)*3+Math.min(15,+p)*1)/2);
}
function calcBlockII(){
  initCalcDefaults();
  var exams=S.calcExams.filter(function(e){return e.grade!==''&&!isNaN(+e.grade);});
  if(exams.length===0) return 0;
  var factor=exams.length>=5?4:5;
  var total=exams.reduce(function(sum,e){return sum+Math.min(15,Math.max(0,+e.grade))*factor;},0);
  return Math.min(300,total);
}
function calcResult(){
  var b1=calcBlockI();
  var semBonus=0;
  if(isBayern()&&S.calcSeminarEnabled){
    S.calcSeminar.forEach(function(sem){var sc=calcSeminarScore(sem);if(sc!==null)semBonus+=sc;});
  }
  var blockI=Math.min(600,b1+semBonus);
  var blockII=calcBlockII();
  var total=blockI+blockII;
  if(total<1) return null;
  var grade=Math.max(1.0,Math.min(4.0,(900-total)/60+1));
  var lkCount=S.calcSubjects.filter(function(s){return s.lk;}).length;
  var defizite=0;
  S.calcSubjects.forEach(function(sub){
    sub.grades.forEach(function(g){if(g!==''&&!isNaN(+g)&&+g<5)defizite++;});
  });
  return {blockI:blockI,blockII:blockII,total:total,grade:grade.toFixed(1).replace('.',','),passed:total>=300&&blockI>=200&&blockII>=100,defizite:defizite,semBonus:semBonus};
}
function getLkDoubledStatus(){
  var count=0;
  var status={};
  S.calcSubjects.forEach(function(sub){
    if(sub.lk){
      count++;
      status[sub.id]=count<=2?'doubled':'lk_only';
    } else {
      status[sub.id]='gk';
    }
  });
  return status;
}

// ==================== AUTH ====================
function buildAuth(){
  var wrap=document.createElement('div');wrap.className='hero-bg';wrap.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px';
  var box=document.createElement('div');box.className='modal-box';box.style.position='relative';
  var bk=document.createElement('button');bk.style.cssText='position:absolute;top:16px;left:16px;background:none;border:none;cursor:pointer;color:#94a3b8;font-size:13px';bk.textContent='← Zurück';bk.onclick=function(){go('landing');};box.appendChild(bk);
  box.innerHTML+='<div style="text-align:center;margin-bottom:22px"><div style="font-size:40px">🎓</div><div style="font-weight:800;font-size:20px;margin-top:8px">Jetzt Abitur!</div><div style="color:#64748b;font-size:13px;margin-top:4px">'+(S.authMode==='login'?'Willkommen zurück!':'Starte jetzt durch!')+'</div></div>';
  var tabs=mk('<div style="display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:20px"></div>');
  ['Login','Registrieren'].forEach(function(label,i){
    var active=(i===0&&S.authMode==='login')||(i===1&&S.authMode==='register');
    var t=document.createElement('button');t.style.cssText='flex:1;padding:10px;font-weight:700;font-size:14px;border:none;background:none;cursor:pointer;color:'+(active?'#1d4ed8':'#94a3b8')+';border-bottom:'+(active?'2px solid #1d4ed8':'2px solid transparent')+';margin-bottom:-2px';t.textContent=label;
    var m=i===0?'login':'register';t.onclick=function(){S.authMode=m;render();};tabs.appendChild(t);
  });
  box.appendChild(tabs);
  function field(lbl,type,ph){var w=document.createElement('div');w.style.marginBottom='12px';var l=document.createElement('label');l.style.cssText='font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px';l.textContent=lbl;var i=document.createElement('input');i.type=type;i.placeholder=ph;i.className='wide-inp';w.appendChild(l);w.appendChild(i);return w;}
  var nameField, emailField, pwField;
  if(S.authMode==='register'){nameField=field('Name','text','Dein vollständiger Name');box.appendChild(nameField);}
  emailField=field('E-Mail','email','deine@email.de');box.appendChild(emailField);
  pwField=field('Passwort','password','••••••••');box.appendChild(pwField);
  var errBox=document.createElement('div');errBox.style.cssText='display:none;background:#fee2e2;color:#dc2626;font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px';box.appendChild(errBox);
  function showErr(msg){errBox.textContent=msg;errBox.style.display='block';}
  var mb=document.createElement('button');mb.className='btn-blue';mb.style.cssText='width:100%;margin-top:10px;margin-bottom:12px';mb.textContent=S.authMode==='login'?'🔐 Anmelden':'🚀 Konto erstellen';
  mb.onclick=async function(){
    if(!sb){showErr('Supabase ist noch nicht konfiguriert (siehe SUPABASE_URL / SUPABASE_ANON_KEY im Code).');return;}
    var email=emailField.querySelector('input').value.trim();
    var pw=pwField.querySelector('input').value;
    var name=nameField?nameField.querySelector('input').value.trim():'';
    if(!email||!pw){showErr('Bitte E-Mail und Passwort ausfüllen.');return;}
    mb.disabled=true;mb.textContent='Bitte warten...';
    var result;
    if(S.authMode==='register'){
      result=await sb.auth.signUp({email:email,password:pw,options:{data:{full_name:name}}});
    } else {
      result=await sb.auth.signInWithPassword({email:email,password:pw});
    }
    mb.disabled=false;mb.textContent=S.authMode==='login'?'🔐 Anmelden':'🚀 Konto erstellen';
    if(result.error){showErr(result.error.message);return;}
    if(S.authMode==='register' && result.data.user && !result.data.session){
      showErr('Konto erstellt! Bitte bestätige deine E-Mail über den Link, den wir dir geschickt haben, und logge dich danach ein.');
      return;
    }
    var u=result.data.user;
    S.user={id:u.id,name:(u.user_metadata&&u.user_metadata.full_name)||name||u.email.split('@')[0],email:u.email,bundesland:'',premium:false};
    go('onboarding');
  };
  box.appendChild(mb);
  var gb=document.createElement('button');gb.className='btn-gray';gb.style.cssText='width:100%;margin-bottom:16px';gb.textContent='🌐 Mit Google fortfahren';
  gb.onclick=async function(){
    if(!sb){showErr('Supabase ist noch nicht konfiguriert.');return;}
    var result=await sb.auth.signInWithOAuth({provider:'google'});
    if(result.error)showErr(result.error.message+' (Google-Login muss zusätzlich im Supabase-Dashboard unter Authentication > Providers aktiviert werden.)');
  };
  box.appendChild(gb);
  var sw=document.createElement('div');sw.style.cssText='text-align:center;font-size:13px;color:#64748b';var swL=document.createElement('span');swL.style.cssText='color:#1d4ed8;font-weight:700;cursor:pointer';swL.textContent=S.authMode==='login'?'Registrieren':'Anmelden';swL.onclick=function(){S.authMode=S.authMode==='login'?'register':'login';render();};sw.appendChild(document.createTextNode(S.authMode==='login'?'Noch kein Konto? ':'Schon registriert? '));sw.appendChild(swL);box.appendChild(sw);
  box.appendChild(bk);wrap.appendChild(box);return wrap;
}

  box.appendChild(ph);
  if(step===0){
    box.innerHTML+='<h2 style="font-weight:800;font-size:20px;margin-bottom:6px">🏛️ Wähle dein Bundesland</h2><p style="color:#64748b;font-size:13px;margin-bottom:16px">Der Abi-Rechner und die Lernpläne werden für dein Bundesland angepasst.</p>';

    BL_NAMES.forEach(function(bl){var sel=S.ob.bl===bl;var b=document.createElement('button');b.style.cssText='padding:9px 12px;border-radius:10px;border:2px solid '+(sel?'#1d4ed8':'#e2e8f0')+';background:'+(sel?'#eff6ff':'transparent')+';cursor:pointer;font-weight:600;font-size:12px;text-align:left;color:'+(sel?'#1d4ed8':'#374151');b.textContent=bl;b.onclick=function(){S.ob.bl=bl;render();};g.appendChild(b);});
    box.appendChild(g);

  } else if(step===1){
    box.innerHTML+='<h2 style="font-weight:800;font-size:20px;margin-bottom:6px">🏫 Schulform</h2><p style="color:#64748b;font-size:13px;margin-bottom:16px">Welche Schulform besuchst du?</p>';

  } else if(step===2){
    box.innerHTML+='<h2 style="font-weight:800;font-size:20px;margin-bottom:6px">📅 Abiturjahr</h2><p style="color:#64748b;font-size:13px;margin-bottom:16px">Wann machst du dein Abitur?</p>';
    ['2025','2026','2027','2028'].forEach(function(y){var sel=S.ob.year===y;var b=document.createElement('button');b.style.cssText='width:100%;padding:13px 16px;border-radius:12px;border:2px solid '+(sel?'#1d4ed8':'#e2e8f0')+';background:'+(sel?'#eff6ff':'transparent')+';cursor:pointer;font-weight:600;font-size:14px;text-align:left;margin-bottom:8px;color:'+(sel?'#1d4ed8':'#374151');b.textContent='Abitur '+y;b.onclick=function(){S.ob.year=y;render();};box.appendChild(b);});
  } else if(step===3){
    var r3=getRules();
    box.innerHTML+='<h2 style="font-weight:800;font-size:20px;margin-bottom:6px">⭐ '+r3.lkTerm+'e wählen</h2><p style="color:#64748b;font-size:13px;margin-bottom:6px">Wähle bis zu 3 Leistungskurse. Nur die ersten 2 werden doppelt gewichtet.</p>';
    var g3=mk('<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:260px;overflow-y:auto"></div>');
    SUBJECTS.forEach(function(sub){var sel=S.ob.lk.indexOf(sub.id)>=0;var b=document.createElement('button');b.style.cssText='padding:10px;border-radius:10px;border:2px solid '+(sel?sub.col:'#e2e8f0')+';background:'+(sel?sub.col+'18':'transparent')+';cursor:pointer;font-weight:600;font-size:12px;text-align:center;color:'+(sel?sub.col:'#374151');b.textContent=sub.icon+' '+sub.name;b.onclick=function(){var idx=S.ob.lk.indexOf(sub.id);if(idx>=0)S.ob.lk.splice(idx,1);else if(S.ob.lk.length<3)S.ob.lk.push(sub.id);render();};g3.appendChild(b);});

  }

  if(step>0){var bkB=document.createElement('button');bkB.className='btn-gray';bkB.style.flex='1';bkB.textContent='← Zurück';bkB.onclick=function(){S.ob.step--;render();};br.appendChild(bkB);}

  nx.onclick=function(){if(step===steps.length-1){if(S.user)S.user.bundesland=S.ob.bl||'Nordrhein-Westfalen';initCalcDefaults();go('main');}else{S.ob.step++;render();}};
  br.appendChild(nx);box.appendChild(br);wrap.appendChild(box);return wrap;

  var d=document.createElement('div');d.style.cssText='padding:16px 18px';
  var hour=new Date().getHours();var greet=hour<12?'Morgen':(hour<18?'Tag':'Abend');
  var name=(S.user&&S.user.name)?S.user.name.split(' ')[0]:'Schüler';
  var bl=(S.user&&S.user.bundesland)||'NRW';
  var r=getRules();
  d.innerHTML='<div style="margin-bottom:16px"><h2 style="font-weight:800;font-size:20px;margin-bottom:3px">Guten '+greet+', '+name+'! 👋</h2><p style="color:#64748b;font-size:12px;margin:0">'+bl+' · '+r.g8g9+'</p></div>';
  var res=calcResult();
  var gc=document.createElement('div');gc.style.cssText='background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:18px;padding:20px;margin-bottom:16px;cursor:pointer';
  gc.innerHTML='<div style="font-size:11px;opacity:.8;margin-bottom:3px">Voraussichtlicher Abi-Schnitt</div><div style="font-size:44px;font-weight:900;line-height:1.1;margin-bottom:6px">'+(res?res.grade:'–')+'</div>';
  var gd=mk('<div style="display:flex;gap:12px;flex-wrap:wrap"></div>');
  if(res){gd.appendChild(mk('<div style="background:rgba(255,255,255,.12);border-radius:8px;padding:5px 10px;font-size:12px">Block I: <b>'+res.blockI+'/600</b></div>'));gd.appendChild(mk('<div style="background:rgba(255,255,255,.12);border-radius:8px;padding:5px 10px;font-size:12px">Block II: <b>'+res.blockII+'/300</b></div>'));gd.appendChild(mk('<div style="background:rgba(255,255,255,.12);border-radius:8px;padding:5px 10px;font-size:12px">Gesamt: <b>'+res.total+'/900</b></div>'));}
  else{gd.appendChild(mk('<div style="font-size:12px;opacity:.8">Noten im Rechner eintragen →</div>'));}
  gc.appendChild(gd);gc.onclick=function(){setTab('calc');};d.appendChild(gc);
  var sg=mk('<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"></div>');
  [['🔥','12 Tage','Streak'],['⭐','+180 XP','Heute'],['📚','15 Fächer','Verfügbar'],['🃏','12 Karten','Fällig']].forEach(function(x){var c=document.createElement('div');c.className='card';c.style.padding='14px';c.innerHTML='<div style="font-size:22px;margin-bottom:4px">'+x[0]+'</div><div style="font-weight:800;font-size:17px">'+x[1]+'</div><div style="font-size:11px;color:#94a3b8;margin-top:1px">'+x[2]+'</div>';sg.appendChild(c);});
  d.appendChild(sg);
  var qh=document.createElement('h3');qh.style.cssText='font-weight:700;font-size:15px;margin-bottom:10px';qh.textContent='⚡ Schnellstart';d.appendChild(qh);
  var qa=mk('<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"></div>');
  [['📊','Noten eintragen','calc','#1d4ed8'],['📚','Thema lernen','subs','#7c3aed'],['✏️','AFB Aufgaben','quiz','#059669'],['🤖','KI fragen','ai','#d97706']].forEach(function(x){var b=document.createElement('button');b.style.cssText='padding:14px;border-radius:12px;border:none;background:'+x[3]+'18;color:'+x[3]+';cursor:pointer;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%';b.innerHTML='<span style="font-size:26px">'+x[0]+'</span><span>'+x[1]+'</span>';b.onclick=function(){setTab(x[2]);};qa.appendChild(b);});
  d.appendChild(qa);
  return d;
}

// ==================== CALCULATOR ====================
function buildCalc(){
  initCalcDefaults();
  var d=document.createElement('div');d.style.cssText='padding:16px 18px';
  var r=getRules();var bl=(S.user&&S.user.bundesland)||'NRW';
  var res=calcResult();

  // Header
  var hdr=document.createElement('div');hdr.style.cssText='background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px';
  hdr.innerHTML='<div style="font-size:11px;opacity:.75;margin-bottom:4px">'+bl+' · '+r.g8g9+'</div><div style="font-size:44px;font-weight:900;line-height:1;margin-bottom:10px">'+(res?res.grade:'–')+'</div>';
  if(res){
    var blocks=mk('<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px"></div>');
    [['Block I',res.blockI+'/600'],['Block II',res.blockII+'/300'],['Gesamt',res.total+'/900']].forEach(function(b){blocks.appendChild(mk('<div style="background:rgba(255,255,255,.12);border-radius:8px;padding:8px;text-align:center"><div style="font-weight:800;font-size:13px">'+b[1]+'</div><div style="font-size:10px;opacity:.75">'+b[0]+'</div></div>'));});
    hdr.appendChild(blocks);
    var passEl=mk('<div style="background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px">'+(res.passed?'✅ Bestanden':'⚠️ Noch nicht bestanden')+' · Defizite: '+res.defizite+'</div>');
    hdr.appendChild(passEl);
  }
  d.appendChild(hdr);

  // Info box for BL rules
  d.appendChild(mk('<div style="background:'+(S.dark?'#1e293b':'#fff')+';border:1.5px solid '+(S.dark?'#334155':'#e2e8f0')+';border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:#64748b">ℹ️ <b>'+bl+':</b> '+r.info+'<br><br>📐 <b>Formel:</b> Block I = (Σ gewichtete Noten / Σ Gewichte) × 40 (max 600) | Block II: 4 Fächer×5 oder 5 Fächer×4 (max 300)</div>'));

  // Tabs
  var tabRow=mk('<div style="display:flex;gap:8px;margin-bottom:14px"></div>');
  ['block1','block2'].forEach(function(t,i){
    var active=S.calcTab===t;var b=document.createElement('button');b.className='tab-btn '+(active?'active':'inactive');b.textContent=i===0?'Block I: Halbjahresnoten':'Block II: Abiturprüfungen';b.onclick=function(){S.calcTab=t;render();};tabRow.appendChild(b);
  });
  d.appendChild(tabRow);

  if(S.calcTab==='block1'){
    // Header row
    var colH=mk('<div style="display:flex;gap:4px;padding:0 4px;margin-bottom:6px;font-size:10px;font-weight:700;color:#94a3b8"></div>');
    colH.innerHTML='<div style="flex:1;min-width:0">Fach (LK=×2)</div><div style="width:44px;text-align:center">Q1</div><div style="width:44px;text-align:center">Q2</div><div style="width:44px;text-align:center">Q3</div><div style="width:44px;text-align:center">Q4</div><div style="width:38px;text-align:center">Ø</div><div style="width:28px"></div>';
    d.appendChild(colH);
    var lkStatus=getLkDoubledStatus();
    S.calcSubjects.forEach(function(sub,si){
      var status=lkStatus[sub.id];
      var validGrades=sub.grades.filter(function(g){return g!==''&&!isNaN(+g);});
      var avg=validGrades.length>0?(validGrades.reduce(function(s,v){return s+(+v);},0)/validGrades.length).toFixed(1):'–';
      var avgCol=avg==='–'?'#94a3b8':(+avg>=10?'#16a34a':(+avg>=5?'#d97706':'#dc2626'));
      var row=document.createElement('div');row.className='calc-subject-row';
      // Name & LK toggle
      var nameWrap=mk('<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"></div>');
      var nameEl=mk('<div style="font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sub.name+'</div>');
      nameWrap.appendChild(nameEl);
      var lkBtn=document.createElement('button');
      lkBtn.className='lk-badge '+(sub.lk?'lk-on':'lk-off');
      lkBtn.textContent=status==='doubled'?'LK ×2':status==='lk_only'?'LK ×1':'GK ×1';
      lkBtn.onclick=(function(s){return function(){s.lk=!s.lk;render();};})(sub);
      nameWrap.appendChild(lkBtn);row.appendChild(nameWrap);
      // Grade inputs
      for(var q=0;q<4;q++){
        var inp=document.createElement('input');inp.type='number';inp.min='0';inp.max='15';inp.className='grade-inp';inp.value=sub.grades[q];inp.placeholder='–';
        inp.oninput=(function(s2,qi){return function(e){s2.grades[qi]=e.target.value;};})(sub,q);
        row.appendChild(inp);
      }
      // Average
      row.appendChild(mk('<div style="width:38px;text-align:center;font-weight:800;font-size:13px;color:'+avgCol+'">'+avg+'</div>'));
      // Delete
      var del=document.createElement('button');del.className='btn-sm btn-red-sm';del.textContent='✕';del.style.width='26px';del.style.padding='4px';
      del.onclick=(function(idx){return function(){S.calcSubjects.splice(idx,1);render();};})(si);
      row.appendChild(del);d.appendChild(row);
    });

    // Add subject button
    var addRow=mk('<div style="display:flex;gap:8px;margin-top:8px;margin-bottom:16px"></div>');
    var subjectNames=['Mathematik','Deutsch','Englisch','Physik','Chemie','Biologie','Geschichte','Geographie','Sozialwissenschaften','Informatik','Französisch','Spanisch','Latein','Kunst','Musik','Ethik/Religion','Sport','Erdkunde','Wirtschaft','Politik'];
    var selEl=document.createElement('select');selEl.className='wide-inp';selEl.style.cssText='flex:1;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none;background:'+(S.dark?'#0f172a':'#fff');
    var defOpt=document.createElement('option');defOpt.value='';defOpt.textContent='+ Fach wählen...';selEl.appendChild(defOpt);
    subjectNames.forEach(function(sn){var opt=document.createElement('option');opt.value=sn;opt.textContent=sn;selEl.appendChild(opt);});
    addRow.appendChild(selEl);
    var addBtn=document.createElement('button');addBtn.className='btn-blue';addBtn.style.cssText='padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700';addBtn.textContent='Hinzufügen';
    addBtn.onclick=function(){
      var n=selEl.value;if(!n)return;
      var sub=SUBJECTS.find(function(s){return s.name===n;});
      var icon=sub?sub.icon:'📚';
      S.calcSubjects.push({id:S.calcNextId++,name:n,icon:icon,lk:false,grades:['','','','']});
      render();
    };
    addRow.appendChild(addBtn);d.appendChild(addRow);

    // Bayern Seminare
    if(isBayern()){
      var semToggle=mk('<div class="calc-subject-row" style="cursor:pointer;margin-bottom:8px"></div>');
      var semCb=document.createElement('input');semCb.type='checkbox';semCb.checked=S.calcSeminarEnabled;semCb.style.cssText='width:16px;height:16px;cursor:pointer;accent-color:#1d4ed8';
      semCb.onchange=function(){S.calcSeminarEnabled=semCb.checked;render();};
      semToggle.appendChild(semCb);semToggle.appendChild(mk('<div style="font-weight:700;font-size:13px;margin-left:8px">🎓 Bayern: Seminare einschließen</div>'));
      d.appendChild(semToggle);
      if(S.calcSeminarEnabled){
        ['W-Seminar','P-Seminar (Seminararbeit)'].forEach(function(semName,si){
          var sem=S.calcSeminar[si];
          var semScore=calcSeminarScore(sem);
          var semCard=mk('<div class="calc-subject-row" style="flex-direction:column;align-items:stretch;gap:10px;margin-bottom:8px"></div>');
          semCard.appendChild(mk('<div style="font-weight:700;font-size:13px">'+semName+(semScore!==null?' → <span style="color:#1d4ed8">'+semScore+'/30 Punkte</span>':'')+'</div>'));
          var semGrid=mk('<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px"></div>');
          ['Mitarbeit Q1','Mitarbeit Q2','Schriftlich (×3)','Präsentation (×1)'].forEach(function(label,fi){
            var fw=mk('<div style="display:flex;flex-direction:column;gap:3px"></div>');
            fw.appendChild(mk('<div style="font-size:10px;color:#94a3b8">'+label+'</div>'));
            var inp=document.createElement('input');inp.type='number';inp.min='0';inp.max='15';inp.className='grade-inp';inp.style.width='100%';
            var key=['ma1','ma2','schriftl','praes'][fi];
            inp.value=sem[key];inp.placeholder='–';
            inp.oninput=(function(s,k){return function(e){s[k]=e.target.value;};})(sem,key);
            fw.appendChild(inp);semGrid.appendChild(fw);
          });
          semCard.appendChild(semGrid);
          if(semScore!==null)semCard.appendChild(mk('<div style="font-size:11px;color:#64748b">Formel: (Schriftlich×3 + Präs.×1) ÷ 2 = '+semScore+' von max. 30 Punkten</div>'));
          d.appendChild(semCard);
        });
      }
    }

    // Summary
    d.appendChild(mk('<div style="background:'+(S.dark?'#1e293b':'#f1f5f9')+';border-radius:12px;padding:14px;font-size:13px"><div style="font-weight:700;margin-bottom:8px">📐 Block I Berechnung</div><div style="color:#64748b;line-height:1.8">• 2 Leistungskurse werden mit Faktor <b>×2</b> gewichtet<br>• Restliche Kurse: Faktor <b>×1</b><br>• Formel: (Σ gewichtete Noten) ÷ (Σ Gewichte) × 40<br>• Maximum: <b>600 Punkte</b> | Minimum zum Bestehen: <b>200 Punkte</b>'+(isBayern()?'<br>• Bayern-Seminar: max. 30 Pkt./Seminar (Formel: (S×3+P×1)÷2)':'')+'</div></div>'));
  } else {
    // BLOCK II
    d.appendChild(mk('<div style="background:'+(S.dark?'#1e293b':'#fff')+';border:1.5px solid '+(S.dark?'#334155':'#e2e8f0')+';border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:#64748b">📋 <b>Block II: Abiturprüfungen</b><br>4 Prüfungsfächer → jede Note × <b>5</b> (max 75/Fach = 300 ges.)<br>5 Prüfungsfächer → jede Note × <b>4</b> (max 60/Fach = 300 ges.)</div>'));
    var filledExams=S.calcExams.filter(function(e){return e.grade!==''&&!isNaN(+e.grade);});
    var factor=filledExams.length>=5?4:5;
    var b2h=mk('<div style="display:flex;gap:4px;padding:0 4px;margin-bottom:6px;font-size:10px;font-weight:700;color:#94a3b8"><div style="flex:1">PRÜFUNGSFACH</div><div style="width:60px;text-align:center">Note (0–15)</div><div style="width:60px;text-align:center">Punkte (×'+factor+')</div></div>');
    d.appendChild(b2h);
    S.calcExams.forEach(function(exam,ei){
      var weighted=exam.grade!==''&&!isNaN(+exam.grade)?Math.min(15,Math.max(0,+exam.grade))*factor:'–';
      var wCol=weighted==='–'?'#94a3b8':(+weighted>=40?'#16a34a':(+weighted>=20?'#d97706':'#dc2626'));
      var row=mk('<div class="calc-subject-row" style="margin-bottom:8px"></div>');
      var nameInp=document.createElement('input');nameInp.type='text';nameInp.placeholder='Prüfungsfach '+(ei+1);nameInp.value=exam.name;nameInp.style.cssText='flex:1;border:none;background:transparent;font-size:13px;font-weight:600;outline:none;color:'+(S.dark?'#f1f5f9':'#0f172a');
      nameInp.oninput=(function(e2){return function(ev){e2.name=ev.target.value;};})(exam);
      row.appendChild(nameInp);
      var gradeInp=document.createElement('input');gradeInp.type='number';gradeInp.min='0';gradeInp.max='15';gradeInp.className='grade-inp';gradeInp.style.width='60px';gradeInp.value=exam.grade;gradeInp.placeholder='–';
      gradeInp.oninput=(function(e2){return function(ev){e2.grade=ev.target.value;};})(exam);
      row.appendChild(gradeInp);
      row.appendChild(mk('<div style="width:60px;text-align:center;font-weight:800;font-size:13px;color:'+wCol+'">'+weighted+'</div>'));
      var del=document.createElement('button');del.className='btn-sm btn-red-sm';del.textContent='✕';del.style.width='26px';del.style.padding='4px';
      del.onclick=(function(idx){return function(){if(S.calcExams.length>1)S.calcExams.splice(idx,1);render();};})(ei);
      row.appendChild(del);d.appendChild(row);
    });
    if(S.calcExams.length<5){var addE=document.createElement('button');addE.className='btn-gray';addE.style.cssText='width:100%;margin-top:4px;font-size:13px;padding:10px';addE.textContent='+ 5. Prüfungsfach hinzufügen (optional)';addE.onclick=function(){S.calcExams.push({id:S.calcNextId++,name:'Prüfung 5',grade:''});render();};d.appendChild(addE);}
    var b2Total=calcBlockII();
    d.appendChild(mk('<div style="background:'+(S.dark?'#1e293b':'#f1f5f9')+';border-radius:12px;padding:14px;margin-top:8px;font-size:13px"><b>Block II Summe: '+b2Total+'/300 Punkte</b> '+(b2Total>=100?'✅ (≥100 Pkt., bestanden)':'⚠️ (min. 100 Pkt. nötig)')+'</div>'));
  }
  return d;
}

// ==================== SUBJECTS ====================
function buildSubs(){
  var d=document.createElement('div');d.style.cssText='padding:16px 18px';

  // Lesson view
  if(S.currentTopic){
    var lt=S.currentTopic;var lesson=LESSONS[lt.key];
    var bk=document.createElement('button');bk.style.cssText='background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:#1d4ed8;margin-bottom:14px;padding:0';bk.textContent='← Zurück zum Fach';bk.onclick=function(){S.currentTopic=null;render();};d.appendChild(bk);
    if(lesson){
      d.appendChild(mk('<h2 style="font-weight:800;font-size:18px;margin-bottom:6px">'+lesson.title+'</h2>'));
      d.appendChild(mk('<p style="font-size:14px;line-height:1.7;color:'+(S.dark?'#e2e8f0':'#374151')+';margin-bottom:16px">'+lesson.intro+'</p>'));
      if(lesson.rules&&lesson.rules.length){
        var sec=mk('<div class="lesson-section"></div>');sec.appendChild(mk('<h4>📐 Wichtige Regeln & Formeln</h4>'));
        var tbl=mk('<table class="formula-table"></table>');tbl.innerHTML='<thead><tr><th>Regel/Name</th><th>Formel</th><th>Beispiel</th></tr></thead>';
        var tb2=document.createElement('tbody');
        lesson.rules.forEach(function(row){var tr=document.createElement('tr');row.forEach(function(cell){var td=document.createElement('td');td.textContent=cell;tr.appendChild(td);});tb2.appendChild(tr);});
        tbl.appendChild(tb2);sec.appendChild(tbl);d.appendChild(sec);
      }
      if(lesson.example){
        var exSec=mk('<div class="lesson-section"></div>');exSec.appendChild(mk('<h4>✏️ Beispielaufgabe</h4>'));
        exSec.appendChild(mk('<div style="font-weight:600;font-size:13px;margin-bottom:8px">Aufgabe:</div><p style="font-size:13px;line-height:1.6;color:'+(S.dark?'#e2e8f0':'#374151')+'">'+lesson.example.problem+'</p>'));
        var solBox=mk('<div class="example-box"></div>');solBox.innerHTML='<div style="font-weight:700;font-size:12px;color:#16a34a;margin-bottom:6px">✅ Lösung:</div><div style="font-size:13px;white-space:pre-wrap;line-height:1.6">'+lesson.example.solution+'</div>';
        exSec.appendChild(solBox);
        exSec.appendChild(mk('<div style="font-size:12px;color:#64748b;margin-top:6px;font-style:italic">'+lesson.example.explanation+'</div>'));
        d.appendChild(exSec);
      }
      if(lesson.tip){var tipSec=mk('<div class="lesson-section"></div>');tipSec.appendChild(mk('<h4>💡 Abitur-Tipp</h4>'));tipSec.appendChild(mk('<div class="tip-box" style="font-size:13px;line-height:1.6">'+lesson.tip+'</div>'));d.appendChild(tipSec);}
      var quizBtn=document.createElement('button');quizBtn.className='btn-blue';quizBtn.style.cssText='width:100%;margin-top:8px';quizBtn.textContent='✏️ Aufgaben zu diesem Thema üben';quizBtn.onclick=function(){S.qSubFilter=lt.subId;setTab('quiz');};d.appendChild(quizBtn);
    } else {
      d.appendChild(mk('<div style="padding:20px;text-align:center"><div style="font-size:40px;margin-bottom:12px">📚</div><div style="font-weight:700;font-size:16px;margin-bottom:6px">'+lt.title+'</div><div style="color:#64748b;font-size:14px;margin-bottom:16px">Dieses Thema wird demnächst mit vollständigen Inhalten gefüllt. Frage deinen KI-Tutor!</div></div>'));
      var aiBtn=document.createElement('button');aiBtn.className='btn-blue';aiBtn.style.cssText='width:100%';aiBtn.textContent='🤖 KI-Tutor zu diesem Thema fragen';aiBtn.onclick=function(){S.aiMsgs=[{role:'ai',text:'Ich erkläre dir gerne "'+lt.title+'"! Stelle deine Frage oder ich gebe dir eine Übersicht der wichtigsten Konzepte.'}];setTab('ai');};d.appendChild(aiBtn);
    }
    return d;
  }

  // Subject detail view
  if(S.subj){
    var sub=S.subj;
    var bkS=document.createElement('button');bkS.style.cssText='background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:#1d4ed8;margin-bottom:14px;padding:0';bkS.textContent='← Alle Fächer';bkS.onclick=function(){S.subj=null;render();};d.appendChild(bkS);
    var hd=mk('<div style="border-radius:14px;padding:18px;margin-bottom:16px;border-left:4px solid '+sub.col+';background:'+sub.col+'12"></div>');
    hd.innerHTML='<div style="font-size:36px;margin-bottom:6px">'+sub.icon+'</div><div style="font-weight:800;font-size:19px;margin-bottom:4px">'+sub.name+'</div><div style="font-size:12px;color:#64748b">'+sub.topics.length+' Themen · Klicke auf ein Thema zum Lernen</div>';
    d.appendChild(hd);
    sub.topics.forEach(function(topic,i){
      var hasLesson=!!LESSONS[sub.id+'_'+topic.id.split('_').pop()]||!!LESSONS[sub.id+'_'+topic.id];
      var c=document.createElement('div');c.className='card';c.style.cssText='padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px';
      var icon2=mk('<div style="width:36px;height:36px;border-radius:10px;background:'+sub.col+'18;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px">'+sub.icon+'</div>');
      var info=mk('<div style="flex:1"><div style="font-weight:600;font-size:14px">'+topic.title+'</div><div style="font-size:11px;color:#94a3b8;margin-top:2px">'+(hasLesson?'✅ Vollständige Lerneinheit verfügbar':'📝 Themenübersicht')+'</div></div>');
      c.appendChild(icon2);c.appendChild(info);
      c.appendChild(mk('<div style="font-size:18px;color:#94a3b8">›</div>'));
      c.onclick=function(){
        var key=sub.id+'_'+topic.id;
        S.currentTopic={key:key,title:topic.title,subId:sub.id};render();
      };

function sendAI(text){
  if(!text||!text.trim())return;
  S.aiMsgs.push({role:'user',text:text.trim()});S.aiInput='';render();
  setTimeout(function(){
    var t=text.toLowerCase();var reply;
    if(t.indexOf('ableit')>=0||t.indexOf('analysis')>=0||t.indexOf('integral')>=0||t.indexOf('mathe')>=0||t.indexOf('stochastik')>=0||t.indexOf('vektor')>=0) reply=AI_REPLIES.math;
    else if(t.indexOf('weimar')>=0||t.indexOf('geschichte')>=0||t.indexOf('kalter krieg')>=0||t.indexOf('ns-')>=0||t.indexOf('nationalsozialist')>=0) reply=AI_REPLIES.his;
    else if(t.indexOf('meiose')>=0||t.indexOf('bio')>=0||t.indexOf('genetik')>=0||t.indexOf('dna')>=0||t.indexOf('evolution')>=0) reply=AI_REPLIES.bio;
    else if(t.indexOf('photo')>=0||t.indexOf('physik')>=0||t.indexOf('newton')>=0||t.indexOf('quanten')>=0) reply=AI_REPLIES.phy;
    else reply=AI_REPLIES.default;
    S.aiMsgs.push({role:'ai',text:reply});S.xp+=5;render();
    setTimeout(function(){var el=document.getElementById('ai-msgs');if(el)el.scrollTop=99999;},60);
  },800);
}

  EXAMS.forEach(function(e,idx){
    var locked=!(S.user&&S.user.premium)&&idx>1;
    var c=mk('<div class="card" style="padding:14px;margin-bottom:10px'+(locked?';opacity:0.8':'')+'"></div>');
    c.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-weight:700;font-size:14px">'+e.sub+' · '+e.year+'</div><div style="font-size:12px;color:#64748b;margin-top:2px">'+e.state+'</div></div><span class="badge '+(e.diff==='Leicht'?'b-green':e.diff==='Schwer'?'b-red':'b-orange')+'">'+e.diff+'</span></div><div style="font-size:11px;color:#94a3b8;margin-bottom:10px">Themen: '+e.topics.join(' · ')+'</div>';
    var br=mk('<div style="display:flex;gap:8px"></div>');
    ['📄 Prüfung','✅ Lösung','📖 Erklärung'].forEach(function(label){var b=document.createElement('button');b.style.cssText='flex:1;padding:7px;border-radius:8px;border:none;background:'+(S.dark?'#0f172a':'#f1f5f9')+';font-size:11px;font-weight:600;cursor:pointer;color:'+(S.dark?'#e2e8f0':'#374151');b.textContent=(locked?'🔒 ':'')+label;if(locked)b.onclick=function(){S.premModal=true;render();};br.appendChild(b);});
    c.appendChild(br);d.appendChild(c);
  });
  return d;
}

// ==================== PROGRESS ====================
function buildProg(){
  var d=document.createElement('div');d.style.cssText='padding:16px 18px';
  var sg=mk('<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"></div>');
  [['🔥','12 Tage','Streak'],['⭐','3.480','Gesamt-XP'],['📚','24','Themen gelernt'],['✏️',''+ALL_QUIZ.length+' verf.','Aufgaben'],['🃏',FLASHCARDS.length+' Karten','Bibliothek'],['⏱️','48h','Lernzeit']].forEach(function(x){var c=mk('<div class="card" style="padding:13px;display:flex;align-items:center;gap:10px"></div>');c.innerHTML='<div style="font-size:26px">'+x[0]+'</div><div><div style="font-weight:800;font-size:16px">'+x[1]+'</div><div style="font-size:11px;color:#94a3b8">'+x[2]+'</div></div>';sg.appendChild(c);});
  d.appendChild(sg);
  var hmh=document.createElement('h3');hmh.style.cssText='font-weight:700;font-size:15px;margin-bottom:10px';hmh.textContent='📅 Lernaktivität';d.appendChild(hmh);
  var hm=mk('<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px"></div>');
  var cols=['#e2e8f0','#bfdbfe','#93c5fd','#60a5fa','#1d4ed8'];
  for(var i=0;i<35;i++){var v=Math.random();var ci=v>0.8?4:(v>0.6?3:(v>0.4?2:(v>0.2?1:0)));var col2=S.dark?(ci===0?'#1e293b':cols[ci]):cols[ci];var dot=document.createElement('div');dot.className='hm-dot';dot.style.background=col2;hm.appendChild(dot);}
  d.appendChild(hm);
  var sph=document.createElement('h3');sph.style.cssText='font-weight:700;font-size:15px;margin-bottom:10px';sph.textContent='Fortschritt nach Fach';d.appendChild(sph);
  var pvs=[80,62,45,38,72,28,55,20];
  SUBJECTS.slice(0,8).forEach(function(sub,i){var p=pvs[i]||30;var c=document.createElement('div');c.className='card';c.style.cssText='padding:12px 14px;margin-bottom:8px';c.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:13px">'+sub.icon+' '+sub.name+'</span><span style="font-size:12px;font-weight:700;color:'+sub.col+'">'+p+'%</span></div><div class="pbar"><div class="pfill" style="width:'+p+'%;background:'+sub.col+'"></div></div>';d.appendChild(c);});
  return d;
}

function buildProfileModal(){
  var overlay=document.createElement('div');overlay.className='modal-bg';overlay.style.zIndex='200';
  var box=document.createElement('div');box.className='modal-box';
  var hdr=document.createElement('div');hdr.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:18px';
  var av=document.createElement('div');av.style.cssText='width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px';av.textContent=(S.user&&S.user.name)?S.user.name.charAt(0):'U';
  var hi=document.createElement('div');hi.style.flex='1';hi.innerHTML='<div style="font-weight:800;font-size:16px">'+(S.user?S.user.name:'Schüler')+'</div><div style="font-size:12px;color:#64748b">'+((S.user&&S.user.bundesland)||'NRW')+'</div>';
  var cl=document.createElement('button');cl.style.cssText='background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8';cl.textContent='X';cl.onclick=function(){S.profileModal=false;render();};
  hdr.appendChild(av);hdr.appendChild(hi);hdr.appendChild(cl);box.appendChild(hdr);

  var tabs=document.createElement('div');tabs.style.cssText='display:flex;gap:6px;margin-bottom:18px';
  [{id:'stats',label:'Stats'},{id:'settings',label:'Einstellungen'},{id:'uni',label:'Uni-Bewerbung'}].forEach(function(t){
    var b=document.createElement('button');b.style.cssText='padding:7px 14px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:'+(S.profileTab===t.id?'#1d4ed8':'#f1f5f9')+';color:'+(S.profileTab===t.id?'#fff':'#64748b');
    b.textContent=t.label;b.onclick=function(){S.profileTab=t.id;render();};tabs.appendChild(b);
  });
  box.appendChild(tabs);

  if(S.profileTab==='uni'){
    var h4=document.createElement('h4');h4.style.cssText='font-weight:800;font-size:15px;margin-bottom:12px';h4.textContent='Uni-Bewerbungsguide';box.appendChild(h4);
    UNI_SECTIONS.forEach(function(sec,i){
      var card=document.createElement('div');card.style.cssText='margin-bottom:8px;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden';
      var hd2=document.createElement('div');hd2.style.cssText='padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:#f8fafc';
      hd2.innerHTML=sec.icon+' <b style="font-size:13px;flex:1">'+sec.title+'</b>';
      var body=document.createElement('div');body.style.cssText='display:none;padding:14px;font-size:13px;line-height:1.75;white-space:pre-wrap;border-top:1px solid #e2e8f0';body.textContent=sec.content;
      hd2.onclick=function(){body.style.display=body.style.display==='none'?'block':'none';};
      card.appendChild(hd2);card.appendChild(body);box.appendChild(card);
    });
  } else if(S.profileTab==='settings'){
    var lbl=document.createElement('label');lbl.style.cssText='font-size:13px;font-weight:600;display:block;margin-bottom:6px';lbl.textContent='Bundesland';box.appendChild(lbl);
    var sel=document.createElement('select');sel.className='wide-inp';BL_NAMES.forEach(function(bl){var opt=document.createElement('option');opt.value=bl;opt.textContent=bl;if(S.user&&S.user.bundesland===bl)opt.selected=true;sel.appendChild(opt);});box.appendChild(sel);
    var sv=document.createElement('button');sv.className='btn-blue';sv.style.cssText='width:100%;margin-top:12px';sv.textContent='Speichern';sv.onclick=function(){if(S.user)S.user.bundesland=sel.value;S.profileModal=false;render();};box.appendChild(sv);
    var lo=document.createElement('button');lo.className='btn-gray';lo.style.cssText='width:100%;margin-top:8px';lo.textContent='🚪 Abmelden';lo.onclick=async function(){if(sb)await sb.auth.signOut();S.user=null;S.profileModal=false;go('landing');};box.appendChild(lo);
  } else {
    var sg=document.createElement('div');sg.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px';
    [['Streak','12 Tage'],['XP','3.480'],['Themen','24'],['Karten',''+FLASHCARDS.length]].forEach(function(x){sg.innerHTML+='<div class="card" style="padding:13px;text-align:center"><div style="font-weight:800;font-size:18px">'+x[1]+'</div><div style="font-size:11px;color:#94a3b8">'+x[0]+'</div></div>';});
    box.appendChild(sg);
  }
  overlay.appendChild(box);overlay.onclick=function(e){if(e.target===overlay){S.profileModal=false;render();}};return overlay;
}

function buildPremModal(){
  var overlay=document.createElement('div');overlay.className='modal-bg';overlay.style.zIndex='200';
  var box=document.createElement('div');box.className='modal-box';
  box.innerHTML='<div style="text-align:center;margin-bottom:16px"><div style="font-size:44px">&#128142;</div><h2 style="font-weight:800;font-size:19px;margin:8px 0 4px">Jetzt Abitur! Premium</h2><p style="color:#64748b;font-size:13px">Schalte alle Features frei</p></div>';
  ['Korrekter Abi-Rechner (alle 16 BL)','Vollstaendige Lerneinheiten','Unbegrenzte KI-Gespraeche','Pruefungsarchiv + Musterloesungen','KI-Lernplaene','Keine Werbung'].forEach(function(f){box.innerHTML+='<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><span style="color:#16a34a;font-weight:800">v</span><span style="font-size:14px">'+f+'</span></div>';});
  var b1=document.createElement('button');b1.className='btn-blue';b1.style.cssText='width:100%;margin-top:14px;margin-bottom:8px';b1.textContent='4,99 Euro/Monat starten';b1.onclick=function(){if(S.user)S.user.premium=true;S.premModal=false;render();};
  var cl=document.createElement('button');cl.style.cssText='display:block;margin:0 auto;background:none;border:none;color:#94a3b8;cursor:pointer;font-size:13px';cl.textContent='Nein danke';cl.onclick=function(){S.premModal=false;render();};
  box.appendChild(b1);box.appendChild(cl);
  overlay.appendChild(box);overlay.onclick=function(e){if(e.target===overlay){S.premModal=false;render();}};return overlay;
}

(async function initSession(){
  if(sb){
    var s=await sb.auth.getSession();
    if(s.data.session){
      var u=s.data.session.user;
      S.user={id:u.id,name:(u.user_metadata&&u.user_metadata.full_name)||u.email.split('@')[0],email:u.email,bundesland:'',premium:false};
      S.page='main';
    }
  }
  render();
})();
</script>
</body>
</html>
